<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Arcweft Web IME Player-Rendered Sample</title>
    <link
      rel="preload"
      href="./assets/arcweft-demo.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="./ime-sample.css" />
  </head>
  <body>
    <main id="arcweft-host" data-sample="web-ime-player-rendered">
      <canvas
        id="arcweft-canvas"
        tabindex="0"
        aria-label="Arcweft Web IME player-rendered sample canvas"
      ></canvas>
      <p id="arcweft-loading" role="status">Arcweft Web IME sampleを起動しています…</p>
      <pre id="arcweft-fatal" role="alert" hidden></pre>
    </main>
    <script type="module" src="./ime-sample.js"></script>
  </body>
</html>
