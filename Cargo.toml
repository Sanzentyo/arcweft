[workspace]
members = [
    "crates/arcweft-core",
    "crates/arcweft-dialogue",
    "crates/arcweft-id",
    "crates/arcweft",
    "crates/arcweft-lang-hir",
    "crates/arcweft-lang-sema",
    "crates/arcweft-lang-syntax",
    "crates/arcweft-need",
    "crates/arcweft-presentation",
    "crates/arcweft-runtime-plan",
    "crates/arcweft-source",
    "crates/arcweft-test",
    "crates/arcweft-verify",
    "crates/arcweft-verify-lsp",
    "crates/arcweft-verify-oxiz",
    "crates/arcweft-verify-z3",
    "crates/arcweft-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/arcweft"

[workspace.dependencies]
blake3 = "1.8.5"
lsp-types = "0.97.0"
oxiz-solver = "0.2.1"
rowan = "0.16.1"
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
