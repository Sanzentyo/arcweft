[workspace]
members = [
    "crates/arcweft-core",
    "crates/arcweft-compiler",
    "crates/arcweft-agent-protocol",
    "crates/arcweft-agent-mcp",
    "crates/arcweft-debug-model",
    "crates/arcweft-rag",
    "crates/arcweft-agent-runner",
    "crates/arcweft-debug-sqlite",
    "crates/arcweft-adt",
    "crates/arcweft-adapter-context",
    "crates/arcweft-adapter-desktop",
    "crates/arcweft-desktop-contract",
    "crates/arcweft-desktop-host",
    "crates/arcweft-desktop-native",
    "crates/arcweft-glyphon",
    "crates/arcweft-host-adapter",
    "crates/arcweft-dialogue",
    "crates/arcweft-id",
    "crates/arcweft-image",
    "crates/arcweft-memory",
    "crates/arcweft-ref",
    "crates/arcweft",
    "crates/arcweft-lang-hir",
    "crates/arcweft-launch",
    "crates/arcweft-lang-jit-cranelift",
    "crates/arcweft-lang-sema",
    "crates/arcweft-lang-syntax",
    "crates/arcweft-need",
    "crates/arcweft-presentation",
    "crates/arcweft-ui",
    "crates/arcweft-render-native",
    "crates/arcweft-render-text",
    "crates/arcweft-text-layout",
    "crates/arcweft-rust-abi",
    "crates/arcweft-rust-abi-build",
    "crates/arcweft-rust-abi-macros",
    "crates/arcweft-runtime-plan",
    "crates/arcweft-runtime-accelerator",
    "crates/arcweft-browser-bench",
    "crates/arcweft-bundle",
    "crates/arcweft-runtime-host",
    "crates/arcweft-runtime-scheduler",
    "crates/arcweft-source",
    "crates/arcweft-test",
    "crates/arcweft-tooling",
    "crates/arcweft-verify",
    "crates/arcweft-lsp",
    "crates/arcweft-player-native",
    "crates/arcweft-verify-lsp",
    "crates/arcweft-verify-oxiz",
    "crates/arcweft-verify-z3",
    "crates/arcweft-cli",
]
exclude = ["vendor/glyphon"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/arcweft"

[workspace.dependencies]
base64 = "0.22.1"
blake3 = "1.8.5"
bytemuck = "1.25.0"
clap = "4.6.1"
cranelift = { version = "0.121.2", features = ["jit", "module", "native"] }
cranelift-object = "0.121.2"
crossbeam-channel = "0.5.15"
directories = "6.0.0"
enigo = "0.6.1"
futures-channel = "0.3.32"
glam = "0.33.0"
getrandom = "0.4.3"
js-sys = "0.3.99"
lsp-server = "0.7.9"
lsp-types = "0.97.0"
ndarray = "0.17.2"
num_cpus = "1.17.0"
oxiz-solver = "0.2.1"
png = "0.18.1"
pollster = "0.4.0"
rayon = "1.12.0"
rfd = "0.17.2"
rowan = "0.16.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = "2.0.117"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4.72"
web-sys = "0.3.99"
wgpu = { version = "29.0.3", default-features = false, features = ["std", "wgsl"] }
glyphon = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
winit = "0.31.0-beta.2"
xcap = "0.9.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[patch.crates-io]
glyphon = { path = "vendor/glyphon" }
