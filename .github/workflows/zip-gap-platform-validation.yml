name: ZIP gap platform validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  platform-validation:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libegl1-mesa-dev libwayland-dev libxkbcommon-dev libpipewire-0.3-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Remote REPL and stdio MCP focused gates
        run: |
          cargo test -p arcweft-cli agent_repl_stdio_connect_reports_project_hash_binding_policy --all-features -- --nocapture
          cargo test -p arcweft-cli stdio_transport_ --all-features -- --nocapture

      - name: Data codec focused gates
        run: |
          cargo test -p arcweft-codec-arrow --all-features
          cargo test -p arcweft-codec-avro --all-features

      - name: Workspace clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Free Linux clippy artifacts before tests
        if: runner.os == 'Linux'
        run: cargo clean

      - name: Workspace non-CLI lib and integration tests
        timeout-minutes: 45
        run: cargo test --workspace --lib --tests --exclude arcweft-cli

      - name: CLI lib and bin tests
        timeout-minutes: 20
        run: cargo test -p arcweft-cli --lib --bins

      - name: CLI regression harness
        timeout-minutes: 10
        run: cargo test -p arcweft-cli --test regression_harness

      - name: CLI fixture check and run tests
        timeout-minutes: 10
        run: cargo test -p arcweft-cli --test arcw_fixtures_check_run
