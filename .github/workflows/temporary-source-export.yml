name: temporary-source-export

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-source-export.yml

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/arcweft-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: arcweft-source-${{ github.sha }}
          path: /tmp/arcweft-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Publish workflow run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          run_id = os.environ["GITHUB_RUN_ID"]
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          api = os.environ["GITHUB_API_URL"]
          server = os.environ["GITHUB_SERVER_URL"]
          request = urllib.request.Request(
              f"{api}/repos/{repository}/statuses/{sha}",
              data=json.dumps(
                  {
                      "state": "success",
                      "context": "temporary-source-export",
                      "description": f"run_id={run_id}",
                      "target_url": f"{server}/{repository}/actions/runs/{run_id}",
                  }
              ).encode(),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          urllib.request.urlopen(request).read()
          PY
