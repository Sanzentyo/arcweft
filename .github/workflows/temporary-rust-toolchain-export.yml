name: temporary-rust-toolchain-export

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-rust-toolchain-export.yml

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Package Rust toolchain
        run: |
          sysroot="$(rustc --print sysroot)"
          tar -C "$(dirname "$sysroot")" -czf /tmp/rust-toolchain-1.96.0.tar.gz "$(basename "$sysroot")"
      - name: Vendor locked dependencies
        run: |
          cargo vendor --locked /tmp/arcweft-cargo-vendor > /tmp/arcweft-vendor-config.toml
          tar -C /tmp -czf /tmp/arcweft-cargo-vendor.tar.gz arcweft-cargo-vendor
      - uses: actions/upload-artifact@v4
        with:
          name: arcweft-rust-toolchain-${{ github.sha }}
          path: |
            /tmp/rust-toolchain-1.96.0.tar.gz
            /tmp/arcweft-cargo-vendor.tar.gz
            /tmp/arcweft-vendor-config.toml
          if-no-files-found: error
          retention-days: 1
      - name: Publish workflow run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          run_id = os.environ["GITHUB_RUN_ID"]
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          api = os.environ["GITHUB_API_URL"]
          server = os.environ["GITHUB_SERVER_URL"]
          request = urllib.request.Request(
              f"{api}/repos/{repository}/statuses/{sha}",
              data=json.dumps(
                  {
                      "state": "success",
                      "context": "temporary-rust-toolchain-export",
                      "description": f"run_id={run_id}",
                      "target_url": f"{server}/{repository}/actions/runs/{run_id}",
                  }
              ).encode(),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          urllib.request.urlopen(request).read()
          PY
