schema = 1
default-profile = "dev"

[package]
id = "org.arcweft.samples.zundamon-awchar"
version = "0.1.0"

[build]
source-dir = "src"

[content-units.characters]
roots = ["@character.zundamon"]
visibility = "package"
demand = "required"

[profiles.dev]
kind = "game"
entry = "@entry.main"
source = "src/main.arcw"
adapter = "sans-io"

[profiles.dev.content.characters]
residency = "startup"
placement = "embedded"
compression = "none"
