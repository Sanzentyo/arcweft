schema = 1
default-profile = "game.main"

[package]
id = "org.arcweft.samples.visual-novel-mini"
version = "0.1.0"

[profiles."game.main"]
kind = "game"
entry = "@entry.main"
source = "src/game.arcw"

[profiles."server.plan"]
kind = "server"
source = "src/server.arcw"
entry = "@entry.http"
adapter = "native-http"

[profiles."server.dev"]
kind = "server"
source = "src/server.arcw"
entry = "@entry.http"
adapter = "native-http"
listen = "127.0.0.1:8080"

[profiles."cli.main"]
kind = "cli"
source = "src/tool.arcw"
entry = "@entry.main"

[profiles."test.opening"]
kind = "test"
entry = "@entry.opening"
source = "tests/opening.arcw"

[profiles."bench.opening"]
kind = "bench"
entry = "@entry.opening"
source = "benches/opening.arcw"
