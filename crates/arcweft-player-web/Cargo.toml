[package]
name = "arcweft-player-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-bundle = { path = "../arcweft-bundle", default-features = false }
arcweft-core = { path = "../arcweft-core" }
arcweft-id = { path = "../arcweft-id" }
arcweft-image = { path = "../arcweft-image" }
arcweft-layout.workspace = true
arcweft-player-scene = { path = "../arcweft-player-scene" }
arcweft-player-text-input = { path = "../arcweft-player-text-input" }
arcweft-render-text = { path = "../arcweft-render-text" }
arcweft-presentation = { path = "../arcweft-presentation" }
arcweft-render-wgpu = { path = "../arcweft-render-wgpu" }
arcweft-runtime-driver = { path = "../arcweft-runtime-driver" }
num-traits = "0.2.19"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
arcweft-lang-hir = { path = "../arcweft-lang-hir" }
arcweft-lang-syntax = { path = "../arcweft-lang-syntax" }
arcweft-runtime-plan = { path = "../arcweft-runtime-plan" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
arcweft-render-web = { path = "../arcweft-render-web" }
futures-channel.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
wgpu = { workspace = true, features = ["webgpu"] }
web-sys = { workspace = true, features = [
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "Performance",
    "Window",
    "console",
] }
winit.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[lints]
workspace = true
