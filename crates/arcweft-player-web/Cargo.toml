[package]
name = "arcweft-player-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-bundle = { path = "../arcweft-bundle", default-features = false }
arcweft-core = { path = "../arcweft-core" }
arcweft-id = { path = "../arcweft-id" }
arcweft-image = { path = "../arcweft-image" }
arcweft-presentation = { path = "../arcweft-presentation" }
arcweft-render-wgpu = { path = "../arcweft-render-wgpu" }
arcweft-runtime-driver = { path = "../arcweft-runtime-driver" }
num-traits = "0.2.19"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
arcweft-render-web = { path = "../arcweft-render-web" }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "Performance",
    "Window",
    "console",
] }
winit.workspace = true

[dev-dependencies]
arcweft-render-text = { path = "../arcweft-render-text" }

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[lints]
workspace = true
