[package]
name = "arcweft-player-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-bundle = { workspace = true, default-features = false }
arcweft-core = { workspace = true }
arcweft-glyphon = { workspace = true }
arcweft-id = { workspace = true }
arcweft-image = { workspace = true }
arcweft-layout.workspace = true
arcweft-player-scene = { workspace = true }
arcweft-player-text-input = { workspace = true }
arcweft-presentation = { workspace = true }
arcweft-render-text = { workspace = true }
arcweft-render-wgpu = { workspace = true }
arcweft-runtime-driver = { workspace = true }
arcweft-text-layout = { workspace = true }
num-traits.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
arcweft-compiler = { workspace = true }
arcweft-lang-sema = { workspace = true }
arcweft-runtime-plan = { workspace = true }
arcweft-source = { workspace = true }
arcweft-view = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
arcweft-render-web = { workspace = true }
arcweft-view = { workspace = true }
futures-channel.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
wgpu = { workspace = true, features = ["webgpu"] }
web-sys = { workspace = true, features = [
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "Performance",
    "Window",
    "console",
] }
winit.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[lints]
workspace = true
