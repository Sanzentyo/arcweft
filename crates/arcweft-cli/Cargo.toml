[package]
name = "arcweft-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-agent-protocol = { path = "../arcweft-agent-protocol" }
arcweft-agent-policy = { path = "../arcweft-agent-policy" }
arcweft-agent-mcp = { path = "../arcweft-agent-mcp" }
arcweft-agent-mcp-client = { path = "../arcweft-agent-mcp-client" }
arcweft-agent-runner = { path = "../arcweft-agent-runner" }
arcweft-content-policy = { path = "../arcweft-content-policy" }
arcweft-core = { path = "../arcweft-core" }
arcweft-adapter-context = { path = "../arcweft-adapter-context", features = ["sema"] }
arcweft-adapter-desktop = { path = "../arcweft-adapter-desktop" }
arcweft-bundle = { path = "../arcweft-bundle" }
arcweft-character = { path = "../arcweft-character" }
arcweft-character-psd = { path = "../arcweft-character-psd" }
arcweft-compiler = { path = "../arcweft-compiler" }
arcweft-debug-sqlite = { path = "../arcweft-debug-sqlite" }
arcweft-debug-model = { path = "../arcweft-debug-model" }
arcweft-desktop-native = { path = "../arcweft-desktop-native" }
arcweft-host-adapter = { path = "../arcweft-host-adapter" }
arcweft-id = { path = "../arcweft-id" }
arcweft-image = { path = "../arcweft-image" }
arcweft-interaction-model.workspace = true
arcweft-lang-hir = { path = "../arcweft-lang-hir" }
arcweft-lang-jit-cranelift = { path = "../arcweft-lang-jit-cranelift" }
arcweft-launch = { path = "../arcweft-launch" }
arcweft-lang-sema = { path = "../arcweft-lang-sema" }
arcweft-lang-syntax = { path = "../arcweft-lang-syntax" }
arcweft-presentation = { path = "../arcweft-presentation" }
arcweft-project = { path = "../arcweft-project" }
arcweft-project-loader = { path = "../arcweft-project-loader" }
arcweft-player-native = { path = "../arcweft-player-native", optional = true }
arcweft-render-native = { path = "../arcweft-render-native", optional = true }
arcweft-render-text = { path = "../arcweft-render-text" }
arcweft-render-wgpu = { path = "../arcweft-render-wgpu", optional = true }
arcweft-rag = { path = "../arcweft-rag" }
arcweft-runtime-accelerator = { path = "../arcweft-runtime-accelerator" }
arcweft-runtime-driver = { path = "../arcweft-runtime-driver", optional = true }
arcweft-runtime-host = { path = "../arcweft-runtime-host" }
arcweft-runtime-plan = { path = "../arcweft-runtime-plan" }
arcweft-runtime-scheduler = { path = "../arcweft-runtime-scheduler" }
arcweft-rust-abi = { path = "../arcweft-rust-abi" }
arcweft-source = { path = "../arcweft-source" }
arcweft-test = { path = "../arcweft-test" }
arcweft-tooling = { path = "../arcweft-tooling" }
arcweft-ui = { path = "../arcweft-ui" }
arcweft-verify = { path = "../arcweft-verify" }
arcweft-verify-oxiz = { path = "../arcweft-verify-oxiz" }
arcweft-verify-z3 = { path = "../arcweft-verify-z3" }
base64.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["derive"] }
ed25519-dalek.workspace = true
png.workspace = true
reedline = { version = "0.48.0", default-features = false, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[[bin]]
name = "arcw"
path = "src/main.rs"

[features]
default = ["native-player", "native-capture"]
agent-repl = ["dep:reedline"]
math-wgpu = ["arcweft-runtime-accelerator/math-wgpu"]
native-capture = ["dep:arcweft-render-native", "dep:arcweft-render-wgpu"]
native-player = ["dep:arcweft-player-native", "dep:arcweft-runtime-driver"]

[lints]
workspace = true
