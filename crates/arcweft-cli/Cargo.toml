[package]
name = "arcweft-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-agent-protocol = { path = "../arcweft-agent-protocol" }
arcweft-agent-mcp = { path = "../arcweft-agent-mcp" }
arcweft-core = { path = "../arcweft-core" }
arcweft-adapter-context = { path = "../arcweft-adapter-context" }
arcweft-adapter-desktop = { path = "../arcweft-adapter-desktop" }
arcweft-bundle = { path = "../arcweft-bundle" }
arcweft-compiler = { path = "../arcweft-compiler" }
arcweft-debug-sqlite = { path = "../arcweft-debug-sqlite" }
arcweft-desktop-native = { path = "../arcweft-desktop-native" }
arcweft-host-adapter = { path = "../arcweft-host-adapter" }
arcweft-id = { path = "../arcweft-id" }
arcweft-image = { path = "../arcweft-image" }
arcweft-lang-hir = { path = "../arcweft-lang-hir" }
arcweft-lang-jit-cranelift = { path = "../arcweft-lang-jit-cranelift" }
arcweft-launch = { path = "../arcweft-launch" }
arcweft-lang-sema = { path = "../arcweft-lang-sema" }
arcweft-lang-syntax = { path = "../arcweft-lang-syntax" }
arcweft-presentation = { path = "../arcweft-presentation" }
arcweft-render-native = { path = "../arcweft-render-native", optional = true }
arcweft-render-text = { path = "../arcweft-render-text" }
arcweft-runtime-accelerator = { path = "../arcweft-runtime-accelerator" }
arcweft-runtime-host = { path = "../arcweft-runtime-host" }
arcweft-runtime-scheduler = { path = "../arcweft-runtime-scheduler" }
arcweft-rust-abi = { path = "../arcweft-rust-abi" }
arcweft-test = { path = "../arcweft-test" }
arcweft-tooling = { path = "../arcweft-tooling" }
arcweft-ui = { path = "../arcweft-ui" }
arcweft-verify = { path = "../arcweft-verify" }
arcweft-verify-oxiz = { path = "../arcweft-verify-oxiz" }
arcweft-verify-z3 = { path = "../arcweft-verify-z3" }
blake3.workspace = true
clap = { workspace = true, features = ["derive"] }
png.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[[bin]]
name = "arcw"
path = "src/main.rs"

[features]
default = []
math-wgpu = ["arcweft-runtime-accelerator/math-wgpu"]
native-capture = ["dep:arcweft-render-native"]

[dev-dependencies]
base64.workspace = true

[lints]
workspace = true
