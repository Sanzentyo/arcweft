[package]
name = "arcweft-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-agent-protocol = { workspace = true }
arcweft-agent-policy = { workspace = true }
arcweft-agent-mcp = { workspace = true }
arcweft-agent-mcp-client = { workspace = true }
arcweft-agent-runner = { workspace = true }
arcweft-agent-repl = { workspace = true }
arcweft-content-policy = { workspace = true }
arcweft-core = { workspace = true }
arcweft-adapter-context = { workspace = true }
arcweft-adapter-sema = { workspace = true }
arcweft-adapter-desktop = { workspace = true }
arcweft-bundle = { workspace = true, default-features = true }
arcweft-character = { workspace = true }
arcweft-character-psd = { workspace = true }
arcweft-compiler = { workspace = true }
arcweft-debug-sqlite = { workspace = true }
arcweft-debug-model = { workspace = true }
arcweft-desktop-native = { workspace = true }
arcweft-host-adapter = { workspace = true }
arcweft-glyphon = { workspace = true }
arcweft-id = { workspace = true }
arcweft-image = { workspace = true }
arcweft-interaction-model.workspace = true
arcweft-lang-hir = { workspace = true }
arcweft-lang-jit-cranelift = { workspace = true }
arcweft-launch = { workspace = true }
arcweft-lang-sema = { workspace = true }
arcweft-lang-syntax = { workspace = true }
arcweft-manifest-model = { workspace = true }
arcweft-layout.workspace = true
arcweft-presentation = { workspace = true }
arcweft-project = { workspace = true }
arcweft-project-loader = { workspace = true }
arcweft-resource-model.workspace = true
arcweft-player-native = { workspace = true, optional = true }
arcweft-player-scene = { workspace = true, optional = true }
arcweft-render-text = { workspace = true }
arcweft-text-model = { workspace = true }
arcweft-render-wgpu = { workspace = true, optional = true }
arcweft-rag = { workspace = true }
arcweft-runtime-accelerator = { workspace = true, default-features = true }
arcweft-runtime-driver = { workspace = true, optional = true }
arcweft-runtime-host = { workspace = true }
arcweft-runtime-plan = { workspace = true }
arcweft-runtime-scheduler = { workspace = true }
arcweft-source = { workspace = true }
arcweft-test = { workspace = true }
arcweft-text-layout = { workspace = true }
arcweft-tooling = { workspace = true }
arcweft-view = { workspace = true }
arcweft-verify = { workspace = true }
arcweft-verify-oxiz = { workspace = true }
arcweft-verify-z3 = { workspace = true }
anstream.workspace = true
anstyle.workspace = true
annotate-snippets.workspace = true
base64.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["derive"] }
ed25519-dalek.workspace = true
num-traits.workspace = true
png.workspace = true
pollster = { workspace = true, optional = true }
reedline = { version = "0.48.0", default-features = false, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, optional = true }

[dev-dependencies]
arcweft-dialogue = { workspace = true }
arcweft-lsp = { workspace = true }
arcweft-runtime-driver = { workspace = true }

[[bin]]
name = "arcw"
path = "src/main.rs"

[features]
default = ["native-player", "native-capture"]
agent-repl = ["dep:reedline"]
math-wgpu = ["arcweft-runtime-accelerator/math-wgpu"]
native-capture = [
    "dep:arcweft-player-scene",
    "dep:arcweft-render-wgpu",
    "dep:arcweft-runtime-driver",
    "dep:pollster",
    "dep:wgpu",
]
native-player = ["dep:arcweft-player-native", "dep:arcweft-runtime-driver"]

[lints]
workspace = true
