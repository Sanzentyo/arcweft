[package]
name = "arcweft-runtime-driver"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-bundle = { path = "../arcweft-bundle", default-features = false }
arcweft-core = { path = "../arcweft-core" }
arcweft-interaction-model = { path = "../arcweft-interaction-model" }
arcweft-id = { path = "../arcweft-id" }
arcweft-save = { path = "../arcweft-save" }
arcweft-layout.workspace = true
arcweft-presentation = { path = "../arcweft-presentation" }
arcweft-render-text = { path = "../arcweft-render-text" }
arcweft-view = { path = "../arcweft-view" }
blake3.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
arcweft-runtime-plan = { path = "../arcweft-runtime-plan" }
arcweft-source = { path = "../arcweft-source" }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
