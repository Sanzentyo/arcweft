[package]
name = "arcweft-bundle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-agent-protocol = { path = "../arcweft-agent-protocol" }
arcweft-audio-core = { workspace = true }
arcweft-character = { path = "../arcweft-character" }
arcweft-core = { path = "../arcweft-core" }
arcweft-data = { workspace = true }
arcweft-id = { path = "../arcweft-id" }
arcweft-layout.workspace = true
arcweft-presentation = { path = "../arcweft-presentation" }
arcweft-render-text = { path = "../arcweft-render-text" }
arcweft-serde-bridge = { workspace = true, optional = true }
arcweft-source = { path = "../arcweft-source" }
arcweft-view = { path = "../arcweft-view" }
apache-avro = { workspace = true, optional = true }
blake3.workspace = true
ciborium = { workspace = true, optional = true }
ed25519-dalek.workspace = true
rmp-serde = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml = { workspace = true, optional = true }
yaml-rust2 = { workspace = true, optional = true }
zstd.workspace = true

[dev-dependencies]
arcweft-interaction-model = { path = "../arcweft-interaction-model" }

[features]
default = [
    "format-avro",
    "format-cbor",
    "format-messagepack",
    "format-toml",
    "format-yaml",
]
format-avro = ["dep:apache-avro"]
format-cbor = ["dep:ciborium"]
format-messagepack = ["dep:rmp-serde"]
format-toml = ["dep:toml"]
format-yaml = ["dep:arcweft-serde-bridge", "dep:yaml-rust2"]

[lints]
workspace = true
