[package]
name = "arcweft-adapter-context"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-rust-abi = { path = "../arcweft-rust-abi" }
arcweft-lang-sema = { path = "../arcweft-lang-sema", optional = true }
arcweft-lang-hir = { path = "../arcweft-lang-hir", optional = true }
arcweft-lang-syntax = { path = "../arcweft-lang-syntax", optional = true }
arcweft-source = { path = "../arcweft-source", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[features]
default = []
sema = [
    "dep:arcweft-lang-hir",
    "dep:arcweft-lang-sema",
    "dep:arcweft-lang-syntax",
    "dep:arcweft-source",
]

[lib]
path = "src/lib.rs"

[lints]
workspace = true
