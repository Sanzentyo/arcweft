[package]
name = "arcweft-runtime-accelerator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-core = { path = "../arcweft-core" }
bytemuck = { workspace = true, optional = true }
glam = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arcweft-lang-jit-cranelift = { path = "../arcweft-lang-jit-cranelift", optional = true }

[features]
default = ["math-glam", "math-ndarray", "native-jit"]
native-jit = ["dep:arcweft-lang-jit-cranelift"]
math-glam = ["dep:glam"]
math-ndarray = ["dep:ndarray"]
math-wgpu = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]

[lib]
path = "src/lib.rs"

[lints]
workspace = true
