[package]
name = "arcweft-player-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
dev-capture = ["dep:png"]
dev-source = ["dep:arcweft-compiler"]

[dependencies]
arcweft-compiler = { path = "../arcweft-compiler", optional = true }
arcweft-adapter-desktop = { path = "../arcweft-adapter-desktop" }
arcweft-bundle = { path = "../arcweft-bundle" }
arcweft-core = { path = "../arcweft-core" }
arcweft-desktop-native = { path = "../arcweft-desktop-native" }
arcweft-host-adapter = { path = "../arcweft-host-adapter" }
arcweft-render-native = { path = "../arcweft-render-native" }
arcweft-render-text = { path = "../arcweft-render-text" }
arcweft-runtime-host = { path = "../arcweft-runtime-host" }

clap = { workspace = true, features = ["derive"] }
png = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "arcweft-player-native"
path = "src/main.rs"

[lints]
workspace = true
