[package]
name = "arcweft-player-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-core = { path = "../arcweft-core" }
arcweft-lang-hir = { path = "../arcweft-lang-hir" }
arcweft-lang-sema = { path = "../arcweft-lang-sema" }
arcweft-lang-syntax = { path = "../arcweft-lang-syntax" }
arcweft-render-text = { path = "../arcweft-render-text" }
arcweft-runtime-plan = { path = "../arcweft-runtime-plan" }
arcweft-text-layout = { path = "../arcweft-text-layout" }

clap = { workspace = true, features = ["derive"] }
glyphon.workspace = true
png.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, features = ["dx12", "metal", "vulkan"] }
winit.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "arcweft-player-native"
path = "src/main.rs"

[lints]
workspace = true
