[package]
name = "arcweft-player-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
dev-capture = ["dep:png"]
macos-appkit-ime-sample = ["arcweft-desktop-native/macos-appkit-text-input"]

[dependencies]
arcweft-adapter-desktop = { workspace = true }
arcweft-audio-codec = { workspace = true }
arcweft-audio-core = { workspace = true }
arcweft-audio-device-cpal = { workspace = true, features = ["native-microphone"] }
arcweft-bundle = { workspace = true, default-features = true }
arcweft-core = { workspace = true }
arcweft-desktop-contract = { workspace = true }
arcweft-desktop-native = { workspace = true }
arcweft-host-adapter = { workspace = true }
arcweft-id = { workspace = true }
arcweft-interaction-model = { workspace = true }
arcweft-layout.workspace = true
arcweft-player-scene = { workspace = true }
arcweft-player-text-input = { workspace = true }
arcweft-presentation = { workspace = true }
arcweft-resource-model = { workspace = true }
arcweft-render-wgpu = { workspace = true }
arcweft-render-text = { workspace = true }
arcweft-text-model = { workspace = true }
arcweft-runtime-driver = { workspace = true }
arcweft-runtime-host = { workspace = true }
arcweft-save.workspace = true

clap = { workspace = true, features = ["derive"] }
png = { workspace = true, optional = true }
pollster.workspace = true
num-traits.workspace = true
raw-window-handle.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, features = ["dx12", "metal", "vulkan"] }
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation"] }

[dev-dependencies]
arcweft-character = { workspace = true }
arcweft-dialogue = { workspace = true }
arcweft-runtime-plan = { workspace = true }
arcweft-source = { workspace = true }
arcweft-view = { workspace = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "arcweft-player-native"
path = "src/main.rs"

[[bin]]
name = "windows-tsf-ime-sample"
path = "src/bin/windows_tsf_ime_sample.rs"

[lints]
workspace = true
