[package]
name = "arcweft-lang-jit-cranelift"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-core = { path = "../arcweft-core" }
cranelift.workspace = true
cranelift-object.workspace = true
thiserror.workspace = true

[lib]
path = "src/lib.rs"

# Native calls are isolated in `native_call`; every other module is checked as
# safe Rust by the compiler instead of by repository-text scanning.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
