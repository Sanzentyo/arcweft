<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcweft Browser WebGPU Bench</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        background: Canvas;
        color: CanvasText;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
        font-weight: 650;
      }

      .status {
        margin: 0 0 16px;
        padding: 10px 12px;
        border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
        border-radius: 6px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 7px 8px;
        border-bottom: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
        text-align: left;
        white-space: nowrap;
      }

      th {
        font-weight: 650;
      }

      .error {
        color: #b42318;
      }

      pre {
        overflow: auto;
        padding: 12px;
        border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
        border-radius: 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Arcweft Browser WebGPU Bench</h1>
      <p id="status" class="status">Starting benchmark...</p>
      <table aria-label="benchmark results">
        <thead>
          <tr>
            <th>Case</th>
            <th>Mode</th>
            <th>Median ms</th>
            <th>Dispatches</th>
            <th>Uploaded</th>
            <th>Readback</th>
            <th>Correct</th>
            <th>Fallback</th>
          </tr>
        </thead>
        <tbody id="cases"></tbody>
      </table>
      <pre id="json"></pre>
    </main>
    <script type="module" src="./run.js"></script>
  </body>
</html>
