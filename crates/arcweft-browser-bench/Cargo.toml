[package]
name = "arcweft-browser-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arcweft-runtime-accelerator = { path = "../arcweft-runtime-accelerator", default-features = false, features = ["native-jit"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
arcweft-core = { path = "../arcweft-core" }
arcweft-runtime-accelerator = { path = "../arcweft-runtime-accelerator", default-features = false, features = ["math-wgpu"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Performance"] }

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "browser_bench_host"
path = "src/bin/browser_bench_host.rs"

[lints]
workspace = true
